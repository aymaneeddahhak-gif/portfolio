<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Task & Routine Planner built with Flutter and Material 3.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="A-Task">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="icon3D.png"/>
  <title>A-Task • Personal Planner</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      z-index: 999999;
      transition: opacity 0.4s ease;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: splashFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes splashFadeIn {
      0% {
        opacity: 0;
        transform: scale(0.92);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .app-icon-box {
      width: 104px;
      height: 104px;
      background: #FFFFFF;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.18), 0 4px 12px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin-bottom: 22px;
    }

    .app-icon-box img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .app-brand-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin: 0;
      color: #0F172A;
    }

    .app-brand-title span {
      color: #2563EB;
    }

    .app-brand-tagline {
      font-size: 13px;
      font-weight: 600;
      color: #64748B;
      margin-top: 6px;
      letter-spacing: 0.2px;
    }

    .origami-splash-loader {
      width: 48px;
      height: 48px;
      margin: 30px auto 18px;
      position: relative;
      --origami-primary: #38BDF8;
      --origami-fold: #BAE6FD;
      --origami-shadow: rgba(2, 132, 199, 0.28);
      --origami-line: #FFFFFF;
    }

    .origami-splash-loader::before {
      content: '';
      width: 48px;
      height: 5px;
      background: var(--origami-shadow);
      position: absolute;
      top: 60px;
      left: 0;
      border-radius: 50%;
      animation: shadow324 0.5s linear infinite;
    }

    .origami-splash-loader::after {
      content: '';
      width: 100%;
      height: 100%;
      background:
        linear-gradient(225deg, var(--origami-fold) 0 11px, transparent 11.5px),
        linear-gradient(var(--origami-line), var(--origami-line)) 11px 19px / 22px 3px no-repeat,
        linear-gradient(var(--origami-line), var(--origami-line)) 11px 27px / 15px 3px no-repeat,
        var(--origami-primary);
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 6px;
      box-shadow: 0 6px 14px var(--origami-shadow);
      animation: jumpTask360 2s linear infinite;
    }

    #splash-loading.splash-night {
      background: #090D16 !important;
      color: #F8FAFC;
    }

    #splash-loading.splash-night .app-brand-title {
      color: #F8FAFC;
    }

    #splash-loading.splash-night .app-brand-tagline {
      color: #94A3B8;
    }

    @keyframes jumpTask360 {
      0% { transform: translateY(0) rotate(0deg); border-bottom-right-radius: 6px; }
      3.75% { border-bottom-right-radius: 4px; }
      6.25% { transform: translateY(9px) rotate(22.5deg); }
      12.5% { transform: translateY(18px) scale(1, 0.9) rotate(45deg); border-bottom-right-radius: 36px; }
      18.75% { transform: translateY(9px) rotate(67.5deg); }
      25% { transform: translateY(0) rotate(90deg); border-bottom-right-radius: 6px; }
      28.75% { border-bottom-right-radius: 4px; }
      31.25% { transform: translateY(9px) rotate(112.5deg); }
      37.5% { transform: translateY(18px) scale(1, 0.9) rotate(135deg); border-bottom-right-radius: 36px; }
      43.75% { transform: translateY(9px) rotate(157.5deg); }
      50% { transform: translateY(0) rotate(180deg); border-bottom-right-radius: 6px; }
      53.75% { border-bottom-right-radius: 4px; }
      56.25% { transform: translateY(9px) rotate(202.5deg); }
      62.5% { transform: translateY(18px) scale(1, 0.9) rotate(225deg); border-bottom-right-radius: 36px; }
      68.75% { transform: translateY(9px) rotate(247.5deg); }
      75% { transform: translateY(0) rotate(270deg); border-bottom-right-radius: 6px; }
      78.75% { border-bottom-right-radius: 4px; }
      81.25% { transform: translateY(9px) rotate(292.5deg); }
      87.5% { transform: translateY(18px) scale(1, 0.9) rotate(315deg); border-bottom-right-radius: 36px; }
      93.75% { transform: translateY(9px) rotate(337.5deg); }
      100% { transform: translateY(0) rotate(360deg); border-bottom-right-radius: 6px; }
    }

    @keyframes shadow324 {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.2, 1); }
    }
  </style>
</head>
<body>
  <div id="splash-loading">
    <div class="splash-content">
      <div class="app-icon-box">
        <img src="icon3D.png" alt="A-Task Logo">
      </div>
      <h1 class="app-brand-title">A-<span>Task</span></h1>
      <p class="app-brand-tagline">Personal Planner &amp; Routines</p>
      <div class="origami-splash-loader" id="origami-splash-loader" aria-label="Loading"></div>
    </div>
  </div>
  <script>
    (function () {
      var h = new Date().getHours();
      var splash = document.getElementById('splash-loading');
      var loader = document.getElementById('origami-splash-loader');
      if (!splash || !loader) return;
      if (h >= 18 || h < 6) {
        splash.classList.add('splash-night');
        loader.style.setProperty('--origami-primary', '#6366F1');
        loader.style.setProperty('--origami-fold', '#A5B4FC');
        loader.style.setProperty('--origami-shadow', 'rgba(129, 140, 248, 0.35)');
      } else if (h >= 12) {
        splash.style.background = '#FFF7F6';
        loader.style.setProperty('--origami-primary', '#F08080');
        loader.style.setProperty('--origami-fold', '#FECDD3');
        loader.style.setProperty('--origami-shadow', 'rgba(240, 128, 128, 0.35)');
      } else {
        splash.style.background = '#F8FAFC';
        loader.style.setProperty('--origami-primary', '#38BDF8');
        loader.style.setProperty('--origami-fold', '#BAE6FD');
        loader.style.setProperty('--origami-shadow', 'rgba(2, 132, 199, 0.28)');
      }
    })();
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash-loading');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          splash.remove();
        }, 120);
      }
    });
  </script>
  <script src="flutter_bootstrap.js?v=atask_crud_flow_v35" async></script>
</body>
</html>
